<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pawmodoro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="titlebar">
    <div class="titlebar-drag"></div>
    <div class="titlebar-controls">
      <button class="btn-minimize" id="btn-minimize" aria-label="Minimize window">&#8212;</button>
      <button class="btn-close" id="btn-close" aria-label="Close window">&#215;</button>
    </div>
  </div>

  <div class="app-body">

    <div class="timer-section">
      <main class="main">
        <div class="cat-container">
          <img class="cat-gif" id="cat-ambient" alt="cat" src="../assets/Cat Idle.gif">
        </div>
        <div class="session-label" id="session-label">Focus</div>
        <div class="active-task-label" id="active-task-label"></div>
        <div class="timer-display" id="timer-display">25:00</div>
        <div class="session-dots" id="session-dots"></div>
        <div class="controls">
          <button class="btn-start" id="btn-start">Start</button>
          <button class="btn-reset" id="btn-reset">Reset</button>
        </div>
      </main>
    </div>

    <div class="todo-panel" id="todo-panel">
      <div class="todo-header">
        <span class="todo-title">To-Do</span>
        <span class="todo-overall" id="todo-overall">0%</span>
        <button class="btn-todo-add-root" id="btn-todo-add-root" aria-label="Add task">+</button>
      </div>
      <div class="todo-list" id="todo-list"></div>
    </div>

  </div>

  <button class="btn-settings" id="btn-settings" aria-label="Open settings">&#9881;</button>
  <button class="btn-room" id="btn-room" aria-label="Open room">&#128101;</button>

  <div class="overlay-celebration" id="overlay-celebration">
    <img class="cat-celebration" id="cat-celebration" alt="celebration cat" src="">
  </div>

  <div class="settings-panel" id="settings-panel">
    <div class="settings-header">
      <span class="settings-title">Settings</span>
      <button class="btn-settings-close" id="btn-settings-close" aria-label="Close settings">&#215;</button>
    </div>
    <div class="settings-body">
      <label>Work (min)<input type="number" id="input-work" min="1" max="120" value="25"></label>
      <label>Short break (min)<input type="number" id="input-short-break" min="1" max="60" value="5"></label>
      <label>Long break (min)<input type="number" id="input-long-break" min="1" max="120" value="30"></label>
      <label>Sessions before long break<input type="number" id="input-sessions" min="1" max="10" value="4"></label>
      <label>Dark mode
        <select id="select-theme">
          <option value="auto">Auto</option>
          <option value="dark">On</option>
          <option value="light">Off</option>
        </select>
      </label>
    </div>
    <button class="btn-save" id="btn-save">Save</button>
  </div>

  <div class="room-panel" id="room-panel">
    <div class="room-header">
      <span class="room-title">Room</span>
      <button class="btn-room-close" id="btn-room-close" aria-label="Close room panel">&#215;</button>
    </div>
    <div class="room-body">
      <div class="room-join-view" id="room-join-view">
        <label>Nickname<input type="text" id="input-nickname" maxlength="24" placeholder="Your name"></label>
        <button class="btn-room-create" id="btn-room-create">Create Room</button>
        <div class="room-join-row">
          <input type="text" id="input-join-code" maxlength="6" placeholder="Enter code">
          <button class="btn-room-join" id="btn-room-join">Join</button>
        </div>
        <div class="room-error" id="room-error"></div>
      </div>
      <div class="room-active-view" id="room-active-view">
        <div class="room-code-display">
          <span class="room-code-label">Room Code</span>
          <span class="room-code-value" id="room-code-value"></span>
        </div>
        <div class="room-participants" id="room-participants"></div>
        <button class="btn-room-leave" id="btn-room-leave">Leave Room</button>
      </div>
    </div>
  </div>

  <script src="timer-logic.js"></script>
  <script src="todo-logic.js"></script>
  <script src="rooms-logic.js"></script>
  <script src="monetization-logic.js"></script>
  <script src="supabase-config.js"></script>
  <script src="supabase.js"></script>
  <script src="revenuecat-config.js"></script>
  <script src="purchases.js"></script>
  <script src="platform.js"></script>
  <script src="app.js"></script>
  <script src="todo.js"></script>
  <script src="monetization.js"></script>
  <script src="rooms.js"></script>
</body>
</html>
